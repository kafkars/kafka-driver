x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,SSL:SSL
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:19092,SSL://:9092,CONTROLLER://:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_SSL_KEYSTORE_FILENAME: kafka-driver.p12
  KAFKA_SSL_KEY_CREDENTIALS: key-password
  KAFKA_SSL_KEYSTORE_CREDENTIALS: store-password
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SSL_CLIENT_AUTH: none
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "3"

x-kafka-healthcheck: &kafka-healthcheck
  test:
    - CMD-SHELL
    - >-
      /opt/kafka/bin/kafka-broker-api-versions.sh
      --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1
  interval: 1s
  timeout: 5s
  retries: 90
  start_period: 10s

services:
  kafka-1:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-1
    volumes:
      - ${KAFKA_1_SSL_SECRETS}:/etc/kafka/secrets:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,SSL://kafka-1:9092
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-2
    volumes:
      - ${KAFKA_2_SSL_SECRETS}:/etc/kafka/secrets:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,SSL://kafka-2:9092
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-3
    volumes:
      - ${KAFKA_3_SSL_SECRETS}:/etc/kafka/secrets:ro
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,SSL://kafka-3:9092
    healthcheck: *kafka-healthcheck

  probe:
    image: rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
    profiles: [probe]
    working_dir: /workspace/kafka-driver
    user: "${KAFKA_PROBE_UID}:${KAFKA_PROBE_GID}"
    environment:
      CARGO_HOME: /cargo-home
      CARGO_TERM_COLOR: never
    volumes:
      - ${KAFKA_DRIVER_SOURCE}:/workspace/kafka-driver:ro
      - ${KAFKA_PROTOCOL_SOURCE}:/workspace/kafka-protocol:ro
      - ${KAFKA_PROBE_TARGET}:/workspace/kafka-driver/target
      - ${KAFKA_PROBE_CARGO_HOME}:/cargo-home
      - ${KAFKA_COORDINATION}:/coordination
      - ${KAFKA_TLS_AUTHORITY}:/secrets:ro
