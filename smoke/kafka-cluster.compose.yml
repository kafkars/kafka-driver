x-kafka-environment: &kafka-environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "3"

x-kafka-healthcheck: &kafka-healthcheck
  test:
    - CMD-SHELL
    - >-
      /opt/kafka/bin/kafka-broker-api-versions.sh
      --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1
  interval: 1s
  timeout: 5s
  retries: 90
  start_period: 10s

services:
  kafka-1:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_1_HOST_PORT}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://127.0.0.1:${KAFKA_1_HOST_PORT}
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_2_HOST_PORT}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://127.0.0.1:${KAFKA_2_HOST_PORT}
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    hostname: kafka-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_3_HOST_PORT}:9092"
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://127.0.0.1:${KAFKA_3_HOST_PORT}
    healthcheck: *kafka-healthcheck

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
