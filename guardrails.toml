schema = 1

[paths]
rust_roots = [
  "src",
  "tests",
  "crates/kafka-driver-core/src",
  "crates/kafka-driver-probe/src",
  "crates/kafka-driver-sim/src",
  "crates/kafka-driver-transport/src",
]

[budgets]
# Facades are navigation, never implementation.
facade = 100
# A production file owns one concept. Split it before it becomes a subsystem.
production = 240
# A test file owns one scenario family or one executable guard.
test = 320

[dependencies]
banned = [
  "async-std",
  "async-trait",
  "smol",
  "tokio",
  "tokio-rustls",
  "tokio-util",
]
kafka_wire_version = "=0.1.0"
kafka_wire_checksum = "4a6bbde74286d49bf2f8531e64bb46132824a03bf6058583c0c79dd5ebd00e78"
kafka_wire_core_version = "=0.1.0"
kafka_wire_core_checksum = "85717dc7f7e3530cc197a92b5087bd7aa975904ed657edbc6ad5c4184e045203"
bornera_version = "=0.0.1-rc.4"
bornera_checksum = "2c7dc0de9db8ded552873ba0677e97f0de6f7c2e2fe792bfc3152883c57a08b6"
bornera_core_version = "=0.0.1-rc.4"
bornera_core_checksum = "eaa2f93c5613d47c5966a3ad981882491f09cec0a346c961321299c8d3a15017"
bornera_rustls_version = "=0.0.1-rc.4"
bornera_rustls_checksum = "282d47be6e2d8bafeb236746a74678965f7c12c1f40282225f88f8b8c956469a"
driver_allowed = ["bornera", "bornera-core", "bornera-rustls", "bytes", "calandria", "calandria-mio", "kafka-driver-core", "kafka-driver-transport", "kafka-wire", "kafka-wire-core", "mio", "ring", "rustls", "sasl-scram", "zeroize"]
core_allowed = ["kafka-wire-core"]
probe_allowed = ["kafka-driver", "kafka-wire", "kafka-wire-core", "rustls"]
transport_allowed = ["bytes", "kafka-driver-core", "kafka-wire-core"]

[[capabilities]]
root = "crates/kafka-driver-core/src"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "crates/kafka-driver-sim/src"
forbidden = [
  "kafka_wire",
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "crates/kafka-driver-transport/src"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "src/negotiation"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]
