schema = 1

[paths]
rust_roots = [
  "src",
  "tests",
  "crates/kafka-driver-core/src",
  "crates/kafka-driver-sim/src",
  "crates/kafka-driver-transport/src",
]

[budgets]
# Facades are navigation, never implementation.
facade = 100
# A production file owns one concept. Split it before it becomes a subsystem.
production = 240
# A test file owns one scenario family or one executable guard.
test = 320

[dependencies]
banned = [
  "async-std",
  "async-trait",
  "smol",
  "tokio",
  "tokio-rustls",
  "tokio-util",
]
kafka_wire_path = "../kafka-protocol/crates/kafka-wire"
kafka_wire_core_path = "../kafka-protocol/crates/kafka-wire-core"
kafka_wire_repository = "kafkars/kafka-wire"
kafka_wire_revision = "a987ce83ea5b4644dd9f1dff66f5fa695cff7280"
driver_allowed = ["bytes", "kafka-driver-core", "kafka-driver-transport", "kafka-wire", "kafka-wire-core", "mio", "rustls", "stringprep", "zeroize"]
core_allowed = ["kafka-wire-core"]
transport_allowed = ["bytes", "kafka-driver-core", "kafka-wire-core"]

[[capabilities]]
root = "crates/kafka-driver-core/src"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "crates/kafka-driver-sim/src"
forbidden = [
  "kafka_wire",
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "crates/kafka-driver-transport/src"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]

[[capabilities]]
root = "src/negotiation"
forbidden = [
  "mio",
  "rustls",
  "std::fs",
  "std::net",
  "std::process",
  "std::thread",
  "std::time::Instant",
  "std::time::SystemTime",
]
