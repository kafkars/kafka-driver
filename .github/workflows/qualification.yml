name: Release qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  real-kafka:
    name: pinned Kafka and performance policy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: kafka-driver
    steps:
      - name: Check out kafka-driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kafka-driver

      - name: Check out verified protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kafkars/kafka-wire
          ref: 9fb021938607fd8d0f84b18ee8fdb71601d4e73b
          path: kafka-protocol

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: kafka-driver/package-lock.json

      - name: Install qualification harness
        run: npm ci

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Qualify publishable crate archives
        run: scripts/qualify-packages
        env:
          CARGO_NET_OFFLINE: "true"

      - name: Run managed real-broker qualification
        run: npm run qualify:real-kafka
