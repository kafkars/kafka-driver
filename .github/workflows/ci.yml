name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: kafka-driver
    steps:
      # Joint development tests the exact reviewed kafka-wire source revision;
      # packaged builds resolve the same declared version from crates.io.
      - name: Check out kafka-driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kafka-driver

      - name: Check out kafka-wire protocol source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kafkars/kafka-wire
          ref: 59bc58425749386a1dc4a0c09ac1b67edf5b65af
          path: kafka-protocol

      - name: Set up zrail
        uses: zactionsz/setup-zrail@9b0d4b677b1f5e138d63e11bb1f67bb8716ed5d9
        with:
          version: "0.0.2"
          sha256: ${{ runner.os == 'Linux' && 'fb535cf8a72cf15995f0c4d2ea640629624b300736c67c7961e058f4a12419d9' || runner.os == 'macOS' && 'efc191a76b71d75e61b195f50759f55562830a4d8ad6c3a2a3bc7b1d8c741141' || '0d1d97ae29fc532d503fb0edba3b18d02a85ce55735bd2d0ad868cbeaebb5a58' }}

      - name: Verify installed zrail
        run: zrail --version

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Run the canonical repository gate
        run: scripts/check
        env:
          CARGO_NET_OFFLINE: "true"
