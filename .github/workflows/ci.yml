name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: kafka-driver
    steps:
      # Joint development tests the exact reviewed kafka-wire source revision;
      # packaged builds resolve the same declared version from crates.io.
      - name: Check out kafka-driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: kafka-driver

      - name: Check out kafka-wire protocol source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: kafkars/kafka-wire
          ref: 3c3ec1e9cc44f47c00f5e5ba6bfb2012e30aa0f5
          path: kafka-protocol

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0

      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Run the canonical repository gate
        run: scripts/check
        env:
          CARGO_NET_OFFLINE: "true"
